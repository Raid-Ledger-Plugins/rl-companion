[package]
name = "rl-companion"
version = "0.1.0"
description = "Raid Ledger Companion desktop app"
# Tauri's macros are exercised against edition 2021 by upstream; the app stays
# there while the library crates use the workspace's 2024.
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "rl_companion_lib"
path = "src/lib.rs"

[[bin]]
name = "rl-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "net"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
url = "2"
gethostname = "0.5"
thiserror = "2"
rl-collectors = { path = "../../../crates/rl-collectors" }
notify = "8"
tauri-plugin-dialog = "2"
# BG3 screenshot collector (ROK-1966): decode Steam's JPEG/PNG, re-encode to a
# lossy WebP <= 1 MiB. Kept in the app crate so rl-collectors stays wasm32-clean.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
webp = { version = "0.3", default-features = false }
# Desktop-only plugins (the app ships for Windows/macOS/Linux only).
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
# In-app updates: signed bundles + latest.json from GitHub Releases (updater.rs).
tauri-plugin-updater = "2.14"
semver = "1"
# Dev bridge (ROK-2055 C2): HTTPS listener + dev-token hashing. All but rcgen
# were already in the lock via reqwest/rustls/rl-collectors.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
sha2 = "0.10"
subtle = "2"
getrandom = "0.2"
base64 = "0.22"
# Log redaction (AC-7); already in the lock via jsonschema.
regex = "1"

# First-run tray promotion on Windows 11 (ROK-2065, tray_promote.rs).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
wiremock = "0.6"
# Test-only LSPK writer for the BG3 collector tests (already in the lock via rl-collectors).
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode"] }
# Validates bg3-screenshot messages and dev-bridge bodies against the pinned contracts (already in the lock via rl-collectors).
jsonschema = { version = "0.30", default-features = false }
