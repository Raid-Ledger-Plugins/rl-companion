[package]
name = "rl-collectors-web"
version = "0.1.0"
description = "Browser (wasm-bindgen) wrapper over rl-collectors: inspectBg3Save reads a BG3 .lsv and returns SaveInfo.json plus the WebP thumbnail."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
rl-collectors = { path = "../rl-collectors" }
wasm-bindgen = "0.2"

[dev-dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Rust 1.90 emits these wasm features by default; the binaryen that
# wasm-pack downloads must be told they are allowed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
    "--enable-multivalue",
]
