name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # On failure, publish the exact fix so it can be applied with `git apply`.
      - name: Produce fmt.patch
        if: failure()
        run: cargo fmt --all && git diff > fmt.patch
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fmt-patch
          path: fmt.patch

  native:
    name: clippy + test (native)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      # The workspace includes the Tauri app (apps/companion), which links
      # webkit2gtk on Linux and embeds the built front-end at compile time.
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/companion/package-lock.json
      - name: Build companion front-end
        working-directory: apps/companion
        run: npm ci && npm run build && npm test
      - name: Release scripts (latest.json, version plan)
        run: node --test scripts/release/release.test.mjs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cargo-lock
          path: Cargo.lock

  wasm:
    name: build + test (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo build -p rl-collectors --target wasm32-unknown-unknown --release
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - run: wasm-pack test --node crates/rl-collectors
      - run: wasm-pack test --node crates/rl-collectors-web
      # Browser package for Raid Ledger's BG3 save upload (ROK-1960). Raid
      # Ledger vendors this pkg/ with the commit sha and the .wasm sha256.
      - name: wasm-pack build rl-collectors-web (--target web, wasm-opt -Oz)
        run: wasm-pack build crates/rl-collectors-web --target web --release
      # The synthetic .lsv Raid Ledger's upload tests feed inspectBg3Save,
      # plus the result it must return. Written after the build, which
      # recreates pkg/.
      - name: Export the synthetic .lsv fixture into pkg/fixtures
        run: |
          out="$PWD/crates/rl-collectors-web/pkg/fixtures"
          RL_FIXTURE_OUT="$out" cargo test -p rl-collectors-web export_synthetic_fixture_for_raid_ledger
          test -s "$out/synthetic-act2.lsv"
          test -s "$out/synthetic-act2.expected.json"
          test -s "$out/synthetic-act2-game-id.lsv"
          test -s "$out/synthetic-act2-game-id.expected.json"
          sha256sum "$out"/* | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report .wasm size
        run: |
          f=crates/rl-collectors-web/pkg/rl_collectors_web_bg.wasm
          raw=$(stat -c%s "$f")
          gz=$(gzip -9 -c "$f" | wc -c)
          sum=$(sha256sum "$f" | cut -d' ' -f1)
          echo "rl_collectors_web_bg.wasm raw=${raw}B gzip=${gz}B sha256=${sum} commit=${GITHUB_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la crates/rl-collectors-web/pkg crates/rl-collectors-web/pkg/fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: rl-collectors-web-pkg
          path: crates/rl-collectors-web/pkg/
          if-no-files-found: error

  # Unsigned desktop bundles (ROK-1961). Windows is THE day-1 target (operator
  # plays WoW on a Windows PC); macOS is secondary. Download from the run's
  # Artifacts section.
  app-build-windows:
    name: app build (windows, unsigned NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/companion/package-lock.json
      - working-directory: apps/companion
        run: npm ci
      - working-directory: apps/companion
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: rl-companion-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  app-build-macos:
    name: app build (macos, unsigned dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/companion/package-lock.json
      - working-directory: apps/companion
        run: npm ci
      - working-directory: apps/companion
        run: npx tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: rl-companion-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
